services:
  - type: web
    name: spotter-weather-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd backend && python manage.py migrate"
    startCommand: "cd backend && gunicorn spotter_routing.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
